<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KarmaBook</title>
<meta name="theme-color" content="#07081a">
<meta name="color-scheme" content="dark only">
<meta name="darkreader-lock">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* KarmaBook · good & bad deeds of the people in my life → trust score. Private, on this phone only. */
:root{
  --bg:#07081a; --s1:#10122b; --s2:#171a3a; --s3:#22264f; --line:#262b58; --line2:#353b72;
  --text:#f1f2ff; --muted:#a3a8d6; --faint:#646a9e;
  --cyan:#2ec5ff; --vio:#7c5cff; --pink:#ff4fa3; --grad:linear-gradient(135deg,#ff4fa3,#7c5cff 50%,#2ec5ff);
  --up:#2ee59d; --dn:#ff5d73; --gold:#ffc54d;
  --disp:'Sora',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@font-face{font-family:'Emo';src:local('Noto Color Emoji'),local('Apple Color Emoji'),local('Segoe UI Emoji'),local('SamsungColorEmoji');unicode-range:U+2600-27BF,U+1F000-1FAFF,U+FE0F,U+200D,U+2B50,U+2705,U+23F0}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14.5px/1.45 var(--body),'Emo';max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 98px);user-select:none;min-height:100vh}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(34% 26% at 8% 10%,color-mix(in srgb,var(--vio) 30%,transparent),transparent 70%),radial-gradient(30% 24% at 95% 28%,color-mix(in srgb,var(--cyan) 16%,transparent),transparent 70%),radial-gradient(32% 26% at 30% 92%,color-mix(in srgb,var(--pink) 13%,transparent),transparent 70%);animation:aur 20s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(-5%,4%) rotate(4deg) scale(1.06)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;width:100%;color-scheme:dark;user-select:text}
textarea{min-height:70px;resize:vertical}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}
.up{color:var(--up)}.dn{color:var(--dn)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 22px -4px var(--vio);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:2px solid var(--cyan);opacity:0;animation:sonar 3.6s ease-out infinite}
.mark svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.brand b{display:block;font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:1.6px;background:linear-gradient(90deg,var(--cyan),var(--vio),var(--pink),var(--cyan));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
.brand small{display:block;font-size:11.5px;color:var(--faint);margin-top:-1px;white-space:nowrap}
@keyframes shim{to{background-position:300% 0}}
.hb{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);color:var(--muted);position:relative;flex:none}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:scale(.92)}
.wbadge{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--pink);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 3px}

/* cards */
.card{background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.012)),var(--s1);border:1px solid color-mix(in srgb,var(--vio) 22%,transparent);border-radius:24px;padding:14px;margin-bottom:12px;position:relative;box-shadow:0 18px 40px -28px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ch h3{margin:0;font-size:11.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.ch span,.ch button.lnk{font-size:11.5px;color:var(--faint)}
.lnk{color:var(--cyan)!important;font-weight:700}
#view>*{animation:rise .45s both}#view>*:nth-child(2){animation-delay:.04s}#view>*:nth-child(3){animation-delay:.08s}#view>*:nth-child(4){animation-delay:.12s}#view>*:nth-child(5){animation-delay:.16s}
#view.l>*{animation-name:slideL}#view.r>*{animation-name:slideR}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-26px)}}
@keyframes slideR{from{opacity:0;transform:translateX(26px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes sonar{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.45);opacity:0}}

/* hero ring */
.hero{padding:14px 14px 14px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 220px at 50% 38%,color-mix(in srgb,var(--rc,var(--vio)) 22%,transparent),transparent 70%);pointer-events:none;transition:background .6s}
.ringw{position:relative;width:236px;height:236px;margin:2px auto 4px}
.ringw .son{position:absolute;inset:18px;border-radius:50%;border:2px solid var(--cyan);opacity:0;animation:sonar 3.6s ease-out infinite;pointer-events:none}
.ringw .son.b{border-color:var(--vio);animation-delay:1.2s}.ringw .son.c{border-color:var(--pink);animation-delay:2.4s}
.ringw.idle .son,.ringw.paused .son{animation-play-state:paused;opacity:0}
.ringw svg{width:100%;height:100%;overflow:visible;display:block}
.arc{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.live{animation:glowp 1.6s ease-in-out infinite}
@keyframes glowp{50%{opacity:.75}}
.head{animation:headp 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes headp{50%{transform:scale(1.35)}}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.rc .k{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
.rc .t{font-family:var(--disp);font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;font-variant-numeric:tabular-nums}
.rc .t small{font-size:22px;color:var(--muted);letter-spacing:0}
.rc .s{font-size:12px;color:var(--muted);margin-top:2px}
.nowpill{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:#fff;box-shadow:0 0 18px -6px var(--c)}
.nowpill i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:glowp 1s infinite}
.paused .nowpill{opacity:.6}
.eta{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:8px 0 12px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--ec,var(--cyan)) 13%,var(--s2));border:1px solid color-mix(in srgb,var(--ec,var(--cyan)) 45%,transparent);font-size:13.5px;line-height:1.35}
.eta .ei{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--ec,var(--cyan)) 25%,transparent);flex:none}
.eta b{color:var(--ec,var(--cyan))}
.eta .go{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.ctl{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
.cb{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 6px;border-radius:16px;font-weight:800;font-size:14px;background:var(--s2);border:1px solid var(--line2);transition:transform .12s}
.cb:active{transform:scale(.95)}
.cb svg{width:16px;height:16px;fill:currentColor}
.cb.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 12px 26px -12px var(--vio);position:relative;overflow:hidden}
.cb.pri::after,.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.4s ease-in-out infinite;pointer-events:none}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.cb.go{background:linear-gradient(135deg,#2ee59d,#12b878);color:#04140c;border:0;box-shadow:0 10px 24px -12px #2ee59d}
.cb:disabled{opacity:.4}
.banner{padding:11px 12px;border-radius:16px;margin-bottom:12px;background:color-mix(in srgb,var(--gold) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);font-size:13px}
.banner .acts{margin-top:8px}

/* step tiles */
.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tl{position:relative;overflow:hidden;text-align:left;border-radius:19px;padding:10px 9px 9px;min-height:86px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) calc(var(--tp,100%) * .95),transparent),color-mix(in srgb,color-mix(in srgb,var(--c) 45%,#0b0c22) var(--tp,100%),transparent));
  box-shadow:0 10px 22px -14px var(--c),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .15s;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.tl::before{content:"";position:absolute;inset:0;background:radial-gradient(110px 70px at 0 0,rgba(255,255,255,.26),transparent 70%);pointer-events:none}
.tl::after{content:"";position:absolute;width:70px;height:70px;right:-24px;bottom:-28px;border-radius:50%;border:10px solid rgba(255,255,255,.09);pointer-events:none}
.tl:active{transform:scale(.94)}
.tl>*{position:relative;z-index:1}
.tl .e{font-size:22px;line-height:1}
.tl .n{font-size:12px;font-weight:800;line-height:1.15;margin-top:5px}
.tl .m{font-size:11.5px;font-weight:700;opacity:.92;font-variant-numeric:tabular-nums}
.tl .m small{font-weight:600;opacity:.8}
.tl .pb{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.85);border-radius:0 3px 3px 0;z-index:2;transition:width 1s linear}
.tl.done{filter:saturate(.55) brightness(.8)}
.tl.done .ck{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.9);color:#10122b;display:grid;place-items:center;font-size:11px;font-weight:900;z-index:2;animation:pop .4s both}
.tl.act{outline:2px solid rgba(255,255,255,.95);outline-offset:-2px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 12px 30px -8px var(--c);transform:translateY(-2px)}
.tl.act .lv{position:absolute;top:7px;right:7px;font-size:8.5px;font-weight:900;letter-spacing:.6px;padding:2px 6px;border-radius:99px;background:rgba(0,0,0,.35);z-index:2}
.tl.act .lv::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin-right:4px;vertical-align:1px;animation:glowp 1s infinite}
.tl.noest .m::after{content:" · not in ETA";font-weight:600;opacity:.7}
.tl.add{background:var(--s1);border:1.5px dashed var(--line2);box-shadow:none;color:var(--muted);align-items:flex-start}
.tl.add::before,.tl.add::after{display:none}
.lt{color:#10131a!important}

/* strip */
.strip{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--s3);margin:2px 0 8px}
.strip i{display:block;height:100%;transform-origin:left;animation:growx .8s cubic-bezier(.2,.9,.3,1) both;border-right:1.5px solid var(--s1)}
@keyframes growx{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* list rows */
.lap{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.lap:last-child{border-bottom:0}
.lap .e{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.lap .n{font-weight:700;font-size:14px}.lap .s{font-size:11.5px;color:var(--faint)}
.lap .v{text-align:right;font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
.lap .v small{display:block;font-family:var(--body);font-size:11px;font-weight:700}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{border-radius:18px;padding:11px 12px;background:linear-gradient(150deg,color-mix(in srgb,var(--c,var(--vio)) 22%,var(--s2)),var(--s1));border:1px solid color-mix(in srgb,var(--c,var(--vio)) 35%,transparent);min-width:0;animation:pop .45s both}
.kpi .k{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.kpi .v{font-family:var(--disp);font-weight:800;font-size:23px;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--faint)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.seg button{padding:8px 4px;border-radius:10px;font-weight:800;color:var(--muted);font-size:13px;transition:all .2s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px -8px var(--vio)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.gb{transform-box:fill-box;transform-origin:50% 100%;animation:growy .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes growy{from{transform:scaleY(0)}}
.draw{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1.3s .1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sb{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:8px;align-items:center;padding:6px 0;font-size:13px}
.sb .tr{height:10px;border-radius:99px;background:var(--s3);overflow:hidden}
.sb .tr b{display:block;height:100%;border-radius:99px;transform-origin:left;animation:growx .8s cubic-bezier(.2,.9,.3,1) both}
.sb .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.ins div{font-size:13px;padding:9px 12px;border-radius:13px;background:var(--s2);border-left:3px solid var(--c,var(--vio));margin-top:7px}

/* calendar */
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pnav h2{margin:0;text-align:center;font-family:var(--disp);font-size:18px}.pnav h2 small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);font-weight:600}
.dow,.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow div{text-align:center;font-size:10.5px;color:var(--faint);font-weight:800;padding-bottom:4px}
.cd{aspect-ratio:1/1.15;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:0;animation:pop .4s both}
.cd.has{background:color-mix(in srgb,var(--c) 26%,var(--s2));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.cd.blank{background:none;border:0;animation:none}.cd.fut{opacity:.3}.cd.td{box-shadow:0 0 0 2px var(--cyan)}.cd.sel{box-shadow:0 0 0 2px var(--pink)}
.cd .n{position:absolute;top:3px;left:5px;font-size:9.5px;color:var(--muted);font-weight:700}
.cd .v{font-family:var(--disp);font-size:12px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
.cgrid.fl{animation:flipm .45s both}@keyframes flipm{from{transform:perspective(600px) rotateX(-70deg);opacity:0}}

/* records */
.rec{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.rec:last-child{border:0}
.rec .e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 22%,var(--s2))}
.rec .v{font-family:var(--disp);font-weight:800;font-size:17px;text-align:right}.rec .v small{display:block;font-family:var(--body);font-size:11px;color:var(--faint);font-weight:600}
.trophy{text-align:center;padding:6px 0 4px}.trophy .big{font-size:54px;animation:float 3s ease-in-out infinite;display:inline-block}
@keyframes float{50%{transform:translateY(-6px)}}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:11px;font-weight:700}
.tb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tb.on{color:var(--text)}.tb.on svg{color:var(--cyan);filter:drop-shadow(0 0 7px color-mix(in srgb,var(--cyan) 80%,transparent));transform:translateY(-2px) scale(1.12)}
.fab{width:60px;height:60px;margin:-28px auto 0;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:0 0 0 5px var(--bg),0 10px 30px -6px var(--vio);animation:fabg 3s ease-in-out infinite;transition:transform .2s}
.fab svg{width:26px;height:26px;fill:#fff}
.fab:active{transform:scale(.9) rotate(20deg)}
@keyframes fabg{50%{box-shadow:0 0 0 5px var(--bg),0 0 36px 4px color-mix(in srgb,var(--vio) 75%,transparent)}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(3,2,12,.62);opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;overscroll-behavior:contain;background:linear-gradient(180deg,color-mix(in srgb,var(--vio) 12%,var(--s1)),var(--s1));border:1px solid var(--line2);border-bottom:0;border-top-color:var(--vio);border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s .32s;box-shadow:0 -20px 50px -20px color-mix(in srgb,var(--vio) 60%,transparent)}
.sheet .grab{width:42px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 12px}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet h3{margin:0 0 12px;font-family:var(--disp);font-size:19px}
.sheet h4{margin:16px 0 6px;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.btn{display:block;width:100%;padding:13px;border-radius:15px;background:var(--s2);border:1px solid var(--line2);font-weight:800;text-align:center;transition:transform .12s;position:relative;overflow:hidden}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 26px -12px var(--vio)}
.btn.danger{color:var(--dn)}
.btn.sm{display:inline-block;width:auto;padding:7px 11px;font-size:12px;border-radius:10px}
.btn.armed{background:var(--dn);color:#fff;border-color:var(--dn)}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}

/* lighter compositing: no live blur, no animated shadows */
.scrim{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(3,2,12,.72)}

<script>
(() => {
'use strict';
/* ===================== config ===================== */
const KEY = 'karmabook.v1', LKEY = 'karmabook.lock', MIN = 60000, DAY = 86400000, HALF = 180;   // a deed's weight halves every 180 days
const DEF_CATS = [['family','Family','👪','#2ee59d'],['friends','Friends','🤝','#2ec5ff'],['coll','Colleagues','💼','#7c5cff'],['others','Others','🌐','#ffb020']].map(([id, n, e, c]) => ({id, n, e, c}));
const DEF_TRAITS = [['honest','Honesty','🫡'],['support','Support','🤲'],['reliable','Reliability','⏰'],['respect','Respect','🙏'],['money','Money','💰'],['promise','Promises','🤝'],['kind','Kindness','💖'],['loyal','Loyalty','🛡️'],['gossip','Gossip','🗣️'],['temper','Temper','😤'],['other','Other','✏️']].map(([id, n, e]) => ({id, n, e}));
const PAL = ['#2ee59d','#2ec5ff','#7c5cff','#ffb020','#ff4fa3','#9b3fd6','#f0428f','#ff6a13','#12a874','#e8364a','#f59f00','#3d63e0','#0aa6d6','#8a3ffc'];
const fresh = () => ({cats:DEF_CATS.map(c => ({...c})), traits:DEF_TRAITS.map(t => ({...t})), people:[], deeds:[], settings:{sound:true}, wish:[]});
const TIERS = [[85,'Core','#2ee59d'],[70,'Trusted','#2ec5ff'],[50,'Careful','#ffb020'],[0,'Guard','#ff5d73']];

/* ===================== state ===================== */
let S;
try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); S = d && Array.isArray(d.people) ? {...fresh(), ...d, settings:{...fresh().settings, ...(d.settings || {})}} : fresh(); } catch(e) { S = fresh(); }
let L = {method:null, hash:null, salt:null, cred:null, grace:0}; try { L = {...L, ...(JSON.parse(localStorage.getItem(LKEY) || '{}'))}; } catch(e) {}
let warned = false;
const SC = new Map();
const save = () => { SC.clear(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { if (!warned) { warned = true; toast('Could not save on this device'); } } };
const saveL = () => { try { localStorage.setItem(LKEY, JSON.stringify(L)); } catch(e) {} };
const UI = {tab:'people', cat:'all', person:null, pf:'all', range:90, tlf:'all'};

/* ===================== helpers ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pk = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dk(new Date());
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const hm = t => { const d = new Date(t), h = d.getHours(); return `${h % 12 || 12}:${pad(d.getMinutes())} ${h < 12 ? 'AM' : 'PM'}`; };
const dShort = t => { const d = new Date(t); return `${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
const short = k => { const d = pk(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };   // used by the wishlist list
const longDay = t => { const d = new Date(t); return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const ago = t => { const d = Math.floor((Date.now() - t) / DAY); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 30 ? `${d} days ago` : d < 365 ? `${Math.round(d / 30)} mo ago` : `${(d / 365).toFixed(1)} yr ago`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const lightOf = hex => { const h = String(hex || '').replace('#', ''); if (h.length < 6) return 0; const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255); return .2126 * r + .7152 * g + .0722 * b; };
const cat = id => S.cats.find(c => c.id === id) || {id, n:'Others', e:'🌐', c:'#646a9e'};
const trait = id => S.traits.find(t => t.id === id) || {id, n:'Other', e:'✏️'};
const person = id => S.people.find(p => p.id === id);
const deedsOf = id => S.deeds.filter(d => d.p === id);
const sgnV = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);

/* ===================== trust score ===================== */
// 50 = neutral. Each deed pushes by its rating (−3…+3); weight halves every 180 days, so people can change.
function score(id, at){
  const exact = at != null; at = at ?? Math.floor(Date.now() / 60000) * 60000;
  const ck = id + '|' + at; if (SC.has(ck)) return SC.get(ck);
  const v = scoreRaw(id, at); SC.set(ck, v); return v;
}
function scoreRaw(id, at){
  const ds = S.deeds.filter(d => d.p === id && d.t <= at); if (!ds.length) return null;
  const raw = ds.reduce((s, d) => s + d.v * Math.pow(.5, (at - d.t) / (HALF * DAY)), 0);
  return Math.round(50 + 50 * Math.tanh(raw / 6));
}
const tier = s => s == null ? ['No record','#646a9e'] : (TIERS.find(t => s >= t[0]) || TIERS[3]).slice(1);
const trend = (id, days = 30) => { const a = score(id), b = score(id, Math.floor(Date.now() / 60000) * 60000 - days * DAY); return a != null && b != null ? a - b : null; };
function circle(list = S.people){ const sc = list.map(p => score(p.id)).filter(x => x != null); return sc.length ? Math.round(avg(sc)) : null; }

/* ===================== lock: fingerprint (step 1) + PIN or pattern (step 2) ===================== */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
async function hashSecret(v, salt){ return b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + v))); }
async function bioAvailable(){ try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e) { return false; } }
async function bioRegister(){
  const c = await navigator.credentials.create({publicKey:{challenge:rand(32), rp:{name:'KarmaBook'}, user:{id:rand(16), name:'karmabook-owner', displayName:'KarmaBook'},
    pubKeyCredParams:[{type:'public-key', alg:-7},{type:'public-key', alg:-257}], authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'}, timeout:60000, attestation:'none'}});
  L.cred = b64(c.rawId); saveL();
}
const bioCheck = () => navigator.credentials.get({publicKey:{challenge:rand(32), allowCredentials:[{type:'public-key', id:unb64(L.cred), transports:['internal']}], userVerification:'required', timeout:60000}});
let LK = {mode:null, method:null, buf:'', first:null, fails:0, until:0, bioOk:false, change:false}, unlocked = false, hiddenAt = 0;
function showLock(mode){ LK = {...LK, mode, buf:'', first:null, bioOk:false}; document.body.classList.remove('open'); $('app').hidden = true; $('lock').hidden = false; renderLock(); }
const FP_ICON = '<svg viewBox="0 0 24 24"><path d="M12 11v3a8 8 0 0 1-2 5.3M8.5 8.5A4 4 0 0 1 16 11v1.5M5 12a7 7 0 0 1 12.6-4.2M19 12v1.5a12 12 0 0 1-1 4.8M12 21.5a11 11 0 0 0 1.8-3.5M8 14.5a14 14 0 0 1-.8 3"/></svg>';
function stepDots(n, of){ return `<div class="lsteps">${Array.from({length:of}, (_, i) => `<i class="${i < n ? 'on' : i === n ? 'cur' : ''}"></i>`).join('')}</div>`; }
function renderLock(msg = ''){
  const m = LK.mode, two = !!L.cred; let h = `<div class="lorbw"><div class="lorb"></div><div class="lorbt">🛡️</div></div>`;
  if (m === 'choose') h += `<h2>${LK.change ? 'Change your lock' : 'Protect KarmaBook'}</h2><p>Step 2 of the lock is a secret only you know. Choose one:</p>
    <div class="lchoose"><button data-lk2="pin"><b>🔢</b>6-digit PIN</button><button data-lk2="pattern"><b>✳️</b>Pattern</button></div>
    ${LK.change ? '<button class="lnk" data-lk2="cancel">Cancel</button>' : '<p class="small" style="margin-top:14px">Step 1 is your fingerprint. You can set it up right after this.</p>'}`;
  else if (m === 'bio') h += `<h2>Unlock KarmaBook</h2>${stepDots(0, 2)}<p>Step 1 of 2 · confirm it's you</p>
    <button class="fpbig" data-lk2="bio">${FP_ICON}<span>Touch to verify fingerprint</span></button><div class="lockerr">${msg}</div>`;
  else { // pin / pattern entry: unlock, set1, set2
    const isPin = (m === 'unlock' ? L.method : LK.method) === 'pin';
    const title = m === 'set1' ? `Create your ${isPin ? 'PIN' : 'pattern'}` : m === 'set2' ? `Confirm your ${isPin ? 'PIN' : 'pattern'}` : 'Unlock KarmaBook';
    const sub = m === 'set1' ? (isPin ? 'Choose 6 digits.' : 'Connect at least 4 dots.') : m === 'set2' ? 'Do it once more to confirm.' : two ? `Step 2 of 2 · enter your ${isPin ? 'PIN' : 'pattern'}` : `Enter your ${isPin ? 'PIN' : 'pattern'}`;
    h += `<h2>${title}</h2>${m === 'unlock' && two ? stepDots(1, 2) : ''}<p>${sub}</p>`;
    if (isPin) h += `<div class="pins" id="pins">${[0,1,2,3,4,5].map(i => `<i class="${i < LK.buf.length ? 'on' : ''}"></i>`).join('')}</div><div class="lockerr" id="lockerr">${msg}</div>
      <div class="padk">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-pin="${n}">${n}</button>`).join('')}<span></span><button data-pin="0">0</button><button data-pin="del" aria-label="Delete">⌫</button></div>`;
    else h += `<div class="lockerr" id="lockerr">${msg}</div><div class="patw"><svg id="pat" viewBox="0 0 300 300"><g id="patLines"></g>${[0,1,2,3,4,5,6,7,8].map(i => `<circle class="pdot" data-i="${i}" cx="${50 + (i % 3) * 100}" cy="${50 + Math.floor(i / 3) * 100}" r="13"/>`).join('')}</svg></div>`;
    if (m !== 'unlock') h += `<button class="lnk" data-lk2="back">‹ Choose PIN or pattern again</button>`;
    if (window.KB_DEMO && m === 'unlock') h += `<p class="small" style="color:var(--gold);margin-top:12px">Preview PIN: 1 2 3 4 5 6</p>`;
  }
  $('lock').innerHTML = h;
  if ($('pat')) bindPattern();
}
function shake(){ const el = $('pins') || $('pat'); if (el) { el.classList.remove('shake'); void el.getBoundingClientRect(); el.classList.add('shake'); } }
async function submitSecret(v){
  const m = LK.mode;
  if (Date.now() < LK.until) { LK.buf = ''; return renderLock(`Too many tries. Wait ${Math.ceil((LK.until - Date.now()) / 1000)}s.`); }
  if (m === 'set1') { LK.first = v; LK.buf = ''; LK.mode = 'set2'; return setTimeout(() => renderLock(), 150); }
  if (m === 'set2') {
    if (v !== LK.first) { LK.buf = ''; LK.mode = 'set1'; snd('err'); return setTimeout(() => { renderLock('They didn\'t match. Start again.'); shake(); }, 150); }
    L.method = LK.method; L.salt = b64(rand(16)); L.hash = await hashSecret(v, L.salt); saveL(); snd('save');
    const wasChange = LK.change; LK.change = false; unlock(); if (wasChange) toast('🔐 Lock updated'); else setTimeout(offerBio, 450); return;
  }
  if (await hashSecret(v, L.salt) === L.hash) { LK.fails = 0; unlock(); }
  else { LK.fails++; LK.buf = ''; snd('err'); vib([40, 40, 40]); if (LK.fails >= 5) { LK.until = Date.now() + 30000; LK.fails = 0; }
    setTimeout(() => { renderLock(LK.until > Date.now() ? 'Too many wrong tries. Wait 30 seconds.' : `Wrong ${L.method === 'pin' ? 'PIN' : 'pattern'}. Try again.`); shake(); }, 120); }
}
function pinKey(k){ if (k === 'del') { LK.buf = LK.buf.slice(0, -1); return renderLock(); } if (LK.buf.length >= 6) return; snd('tap'); vib(10); LK.buf += k; renderLock(); if (LK.buf.length === 6) submitSecret(LK.buf); }
function bindPattern(){
  const svg = $('pat'), lines = $('patLines'); let seq = [], drawing = false, cur = null;
  const pt = e => { const r = svg.getBoundingClientRect(); return {x:(e.clientX - r.left) / r.width * 300, y:(e.clientY - r.top) / r.height * 300}; };
  const hit = p => { for (let i = 0; i < 9; i++) { const cx = 50 + (i % 3) * 100, cy = 50 + Math.floor(i / 3) * 100; if (Math.hypot(p.x - cx, p.y - cy) < 34) return i; } return -1; };
  const C = i => [50 + (i % 3) * 100, 50 + Math.floor(i / 3) * 100];
  const draw = () => { let s = ''; for (let i = 1; i < seq.length; i++) { const [a, b] = C(seq[i - 1]), [c, d] = C(seq[i]); s += `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`; }
    if (drawing && cur && seq.length) { const [a, b] = C(seq[seq.length - 1]); s += `<line class="tail" x1="${a}" y1="${b}" x2="${cur.x}" y2="${cur.y}"/>`; }
    lines.innerHTML = s; svg.querySelectorAll('.pdot').forEach(c => c.classList.toggle('on', seq.includes(+c.dataset.i))); };
  const add = i => { if (i < 0 || seq.includes(i)) return; if (seq.length) { const l = seq[seq.length - 1], mid = (l + i) / 2; if ((l + i) % 2 === 0 && Number.isInteger(mid) && Math.abs((l % 3) - (i % 3)) !== 1 && Math.abs(Math.floor(l / 3) - Math.floor(i / 3)) !== 1 && !seq.includes(mid)) seq.push(mid); } seq.push(i); snd('tap'); vib(8); };
  svg.addEventListener('pointerdown', e => { e.preventDefault(); svg.setPointerCapture(e.pointerId); drawing = true; seq = []; cur = pt(e); add(hit(cur)); draw(); });
  svg.addEventListener('pointermove', e => { if (!drawing) return; cur = pt(e); add(hit(cur)); draw(); });
  const end = () => { if (!drawing) return; drawing = false; draw(); if (seq.length < 4) { if (seq.length) { snd('err'); const e = $('lockerr'); if (e) e.textContent = 'Connect at least 4 dots.'; } seq = []; setTimeout(draw, 400); return; } submitSecret(seq.join('-')); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
}
async function lockAct(k){
  if (k === 'pin' || k === 'pattern') { LK.method = k; LK.mode = 'set1'; LK.buf = ''; snd('tap'); return renderLock(); }
  if (k === 'back') { LK.mode = 'choose'; return renderLock(); }
  if (k === 'cancel') { LK.change = false; return unlock(); }
  if (k === 'bio') { try { await bioCheck(); snd('next'); vib(20); LK.mode = 'unlock'; renderLock(); } catch(e) { renderLock('Fingerprint not confirmed. Tap to try again.'); } }
}
function unlock(){ unlocked = true; $('lock').hidden = true; $('app').hidden = false; snd('unlock'); render(true); }
async function offerBio(){
  const ok = await bioAvailable();
  sheet(`<h3>Step 1: your fingerprint</h3><p class="muted" style="margin-top:-4px">With it on, KarmaBook asks for your fingerprint <b>and</b> your ${L.method === 'pin' ? 'PIN' : 'pattern'} every time.</p>
    ${ok ? '<button class="btn pri" data-act="bioon">Turn on fingerprint (2-step lock)</button>' : '<div class="note" style="color:var(--gold)">Fingerprint works when KarmaBook is opened from the home-screen icon in Chrome or Samsung Internet. Turn it on later in Settings → Lock.</div>'}
    <div style="height:8px"></div><button class="btn" data-act="close">Not now</button>`);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now(); else if (unlocked && L.hash && Date.now() - hiddenAt >= L.grace * 60000) { unlocked = false; showLock(L.cred ? 'bio' : 'unlock'); } });

/* ===================== render ===================== */
let lastTab = 'people';
const TABS = ['people','time','stats','traits'];
function render(anim = true){
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.dataset.t === UI.tab));
  const v = $('view');
  v.innerHTML = UI.person && UI.tab === 'people' ? renderPerson() : ({people:renderPeople, time:renderTime, stats:renderStats, traits:renderTraits}[UI.tab])();
  if (anim) { const d = TABS.indexOf(UI.tab) - TABS.indexOf(lastTab); v.className = ''; void v.offsetWidth; v.className = d > 0 ? 'r' : d < 0 ? 'l' : ''; }
  else v.querySelectorAll(':scope>*').forEach(x => x.style.animation = 'none');
  lastTab = UI.tab; wishBadge(); countUp();
}
function countUp(){ document.querySelectorAll('[data-cu]').forEach(el => { const to = +el.dataset.cu, t0 = performance.now(); const st = t => { const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e); if (k < 1) requestAnimationFrame(st); }; requestAnimationFrame(st); }); }
function ringSVG(val, size, stroke, col, id){
  const r = (size - stroke) / 2 - 4, C = 2 * Math.PI * r, f = val == null ? 0 : val / 100;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${col || '#2ec5ff'}"/><stop offset="1" stop-color="${col ? col : '#ff4fa3'}" stop-opacity="${col ? .75 : 1}"/></linearGradient></defs>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--s3)" stroke-width="${stroke}"/>
    <circle class="rarc" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col ? col : `url(#${id})`}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${Math.max(.01, f * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"${size >= 90 ? ` style="filter:drop-shadow(0 0 6px ${col || '#7c5cff'})"` : ''}/></svg>`;
}

/* ---------- PEOPLE (home) ---------- */
function renderPeople(){
  const list = S.people.filter(p => UI.cat === 'all' || p.cat === UI.cat), C0 = circle(list), allDeeds = S.deeds.filter(d => list.some(p => p.id === d.p));
  const good = allDeeds.filter(d => d.v > 0).length, bad = allDeeds.filter(d => d.v < 0).length;
  const scored = list.map(p => ({p, s:score(p.id)})).filter(x => x.s != null).sort((a, b) => b.s - a.s), top = scored[0], low = scored[scored.length - 1];
  const cT = (() => { const a = list.map(p => trend(p.id)).filter(x => x != null); return a.length ? Math.round(avg(a)) : null; })();
  let h = `<section class="card hero"><div class="ringw"><i class="son"></i><i class="son b"></i><i class="son c"></i>${ringSVG(C0, 140, 12, null, 'hg')}
      <div class="rc"><small>${UI.cat === 'all' ? 'CIRCLE TRUST' : esc(cat(UI.cat).n).toUpperCase()}</small><b ${C0 != null ? `data-cu="${C0}"` : ''}>${C0 ?? '—'}</b><small>${cT == null ? `${list.length} people` : `${cT >= 0 ? '▲' : '▼'} ${Math.abs(cT)} this month`}</small></div></div>

  h += `<div class="chips scroll" style="margin-bottom:10px"><button class="chip${UI.cat === 'all' ? ' on' : ''}" data-act="cat" data-v="all">All <i>${S.people.length}</i></button>${S.cats.map(c => `<button class="chip${UI.cat === c.id ? ' on' : ''}" style="--c:${c.c}" data-act="cat" data-v="${c.id}">${c.e} ${esc(c.n)} <i>${S.people.filter(p => p.cat === c.id).length}</i></button>`).join('')}</div>`;

}
function tileHTML(p, i){

/* ---------- PERSON ---------- */
function renderPerson(){
  const p = person(UI.person); if (!p) { UI.person = null; return renderPeople(); }
  const s = score(p.id), [tn, tc] = tier(s), ds = deedsOf(p.id).sort((a, b) => b.t - a.t), g = ds.filter(d => d.v > 0), b = ds.filter(d => d.v < 0), tr = trend(p.id), c = cat(p.cat);
  let h = `<button class="back" data-act="back">‹ People</button>
    <section class="card phero" style="--c:${p.c || tc}"><div class="pav">${p.e}</div><div style="min-width:0"><div class="pname">${esc(p.n)}</div><div class="small muted">${c.e} ${esc(c.n)}${p.rel ? ' · ' + esc(p.rel) : ''} · since ${dShort(p.created)}</div>
      <div class="tierp" style="--c:${tc}"><i></i>${tn}${tr ? ` · ${tr > 0 ? '▲' : '▼'} ${Math.abs(tr)} in 30 days` : ''}</div></div>
      <div class="gauge">${ringSVG(s, 96, 9, tc, 'pg' + p.id)}<div class="gc"><b ${s != null ? `data-cu="${s}"` : ''}>${s ?? '—'}</b><small>TRUST</small></div></div></section>
    <div class="qb"><button class="qg" data-act="log" data-p="${p.id}" data-k="good">👍 Good deed</button><button class="qbd" data-act="log" data-p="${p.id}" data-k="bad">👎 Bad deed</button></div>`;
  if (ds.length) {
    // score over time
    const first = Math.min(...ds.map(d => d.t)), N = 24, pts = Array.from({length:N}, (_, i) => { const t = first + (Date.now() - first) * i / (N - 1); return {t, s:score(p.id, t + 1)}; }).filter(x => x.s != null);
    const W = 340, H = 110, X = i => i / (pts.length - 1 || 1) * W, Y = v => 8 + (1 - v / 100) * (H - 16);
    const line = pts.map((q, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(q.s).toFixed(1)}`).join(' ');
    h += `<section class="card chart"><div class="ch"><h3>Trust over time</h3><span>50 = neutral</span></div><svg viewBox="0 0 ${W} ${H + 14}"><defs><linearGradient id="ptg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${tc}" stop-opacity=".4"/><stop offset="1" stop-color="${tc}" stop-opacity="0"/></linearGradient></defs>
      ${[85, 70, 50].map(v => `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="${v === 50 ? '5 5' : '2 5'}"/><text x="${W}" y="${Y(v) - 3}" text-anchor="end" font-size="9" fill="var(--faint)">${v}</text>`).join('')}
      <path d="${line} L${W},${H} L0,${H}Z" fill="url(#ptg)"/><path class="draw" d="${line}" fill="none" stroke="${tc}" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="${W}" cy="${Y(pts[pts.length - 1].s)}" r="4.5" fill="#fff" stroke="${tc}" stroke-width="2.5"/>
      <text x="0" y="${H + 12}" font-size="9.5" fill="var(--muted)">${dShort(first)}</text><text x="${W}" y="${H + 12}" text-anchor="end" font-size="9.5" fill="var(--muted)">today</text></svg></section>`;
    // by trait
    const byT = {}; ds.forEach(d => { const o = byT[d.trait] = byT[d.trait] || {g:0, b:0, n:0}; if (d.v > 0) o.g += d.v; else o.b += -d.v; o.n++; });
    const rows = Object.entries(byT).sort((a, b) => (b[1].g + b[1].b) - (a[1].g + a[1].b)), mx = Math.max(...rows.map(([, o]) => Math.max(o.g, o.b)), 1);
    h += `<section class="card"><div class="ch"><h3>By trait</h3><span>🔴 bad · good 🟢</span></div>${rows.map(([id, o], i) => `<div class="tb2"><span class="tn">${trait(id).e} ${esc(trait(id).n)}</span><span class="bb"><i class="l" style="width:${o.b / mx * 50}%;animation-delay:${i * 50}ms"></i></span><span class="bb r"><i class="g" style="width:${o.g / mx * 50}%;animation-delay:${i * 50}ms"></i></span><span class="tv"><span class="dn">${o.b ? '−' + o.b : ''}</span> <span class="up">${o.g ? '+' + o.g : ''}</span></span></div>`).join('')}
      <div class="note">${(() => { const best = rows.filter(([, o]) => o.g > o.b).sort((a, b) => (b[1].g - b[1].b) - (a[1].g - a[1].b))[0], worst = rows.filter(([, o]) => o.b > o.g).sort((a, b) => (b[1].b - b[1].g) - (a[1].b - a[1].g))[0];
        return [best ? `Strongest on <b>${trait(best[0]).n}</b>` : '', worst ? `weakest on <b>${trait(worst[0]).n}</b>` : ''].filter(Boolean).join(' · ') || 'Mixed record so far.'; })()}</div></section>`;
  }

  h += `<div class="seg">${[['all','All ' + ds.length],['good','Good ' + g.length],['bad','Bad ' + b.length]].map(([k, l]) => `<button class="${UI.pf === k ? 'on' : ''}" data-act="pf" data-v="${k}">${l}</button>`).join('')}</div>`;
  const shown = ds.filter(d => UI.pf === 'all' || (UI.pf === 'good' ? d.v > 0 : d.v < 0));
  h += `<section class="card"><div class="ch"><h3>History</h3><span>newest first</span></div>${shown.length ? shown.map(d => { const t = trait(d.trait);
      return `<button class="hist ${d.v > 0 ? 'g' : 'b'}" data-act="editdeed" data-id="${d.id}"><span class="hr">${'●'.repeat(Math.abs(d.v))}<small>${sgnV(d.v)}</small></span><span><b>${d.note ? esc(d.note) : d.v > 0 ? 'Good deed' : 'Bad deed'}</b><div class="small faint">${t.e} ${esc(t.n)} · ${longDay(d.t)}, ${hm(d.t)}</div></span></button>`; }).join('') : '<div class="empty" style="padding:12px">Nothing here yet.</div>'}</section>

    <div class="acts" style="margin-bottom:12px"><button class="btn" data-act="editp" data-id="${p.id}">✏️ Edit person</button></div>`;
  return h;
}

/* ---------- STATS ---------- */

  h += `<div class="kpis" style="margin-bottom:12px"><div class="kpi" style="--c:#7c5cff"><div class="k">Circle trust</div><div class="v">${C0 ?? '—'}</div><div class="s">average of everyone</div></div>
    <div class="kpi" style="--c:#2ec5ff"><div class="k">Deeds logged</div><div class="v">${ds.length}</div><div class="s">${UI.range ? 'in this period' : 'all time'}</div></div>

    <div class="kpi" style="--c:#ffb020"><div class="k">People</div><div class="v">${S.people.length}</div><div class="s">${S.people.filter(p => score(p.id) == null).length} without a record</div></div></div>`;

  h += `<section class="card"><div class="ch"><h3>Where people stand</h3><span>by trust level</span></div><div class="strip">${tc.filter(x => x.k).map(x => `<i style="width:${x.k / tTot * 100}%;background:${x.c}"></i>`).join('')}</div><div class="legend">${tc.map(x => `<span><i style="background:${x.c}"></i>${x.n} ${x.k}</span>`).join('')}</div></section>`;

  // categories
  h += `<section class="card"><div class="ch"><h3>By category</h3><span>average trust</span></div>${S.cats.map((c, i) => { const v = circle(S.people.filter(p => p.cat === c.id)); return `<div class="sb"><span>${c.e} ${esc(c.n)}</span><span class="trk"><b style="width:${v ?? 0}%;background:${c.c};animation-delay:${i * 60}ms"></b></span><span class="v">${v ?? '—'}</span></div>`; }).join('')}</section>`;

  return h;
}

/* ---------- TRAITS ---------- */
function renderTraits(){
  const rows = S.traits.map(t => { const ds = S.deeds.filter(d => d.trait === t.id && person(d.p)), g = ds.filter(d => d.v > 0).length, b = ds.filter(d => d.v < 0).length;
    const per = {}; ds.forEach(d => per[d.p] = (per[d.p] || 0) + d.v); const ps = Object.entries(per).sort((a, b) => b[1] - a[1]);
    return {t, g, b, n:ds.length, best:ps[0] && ps[0][1] > 0 ? ps[0] : null, worst:ps.length && ps[ps.length - 1][1] < 0 ? ps[ps.length - 1] : null}; }).sort((a, b) => b.n - a.n);

    rows.map((r, i) => `<section class="card trc" style="animation-delay:${i * 30}ms"><div class="row"><span class="te">${r.t.e}</span><b style="flex:1">${esc(r.t.n)}</b><span class="pill g">${r.g} 👍</span><span class="pill b">${r.b} 👎</span></div>

}

    else if (kind === 'finish') [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .09, .6, 'triangle', .06));
    else if (kind === 'tap') tone(1320, 0, .05, 'sine', .03);
    else if (kind === 'tab') { tone(900, 0, .06, 'sine', .03); tone(1320, .04, .07, 'sine', .025); }
    else if (kind === 'sheet') tone(660, 0, .09, 'sine', .03);
    else if (kind === 'save') { tone(520, 0, .3, 'sine', .06, 1040); tone(1560, .12, .2, 'sine', .03); }
    else if (kind === 'del') tone(300, 0, .25, 'sawtooth', .04, 80);
    else if (kind === 'err') tone(160, 0, .2, 'square', .03);
    else if (kind === 'good') { tone(659, 0, .14, 'triangle', .06); tone(988, .08, .2, 'triangle', .06); tone(1319, .16, .3, 'sine', .045); }

}
